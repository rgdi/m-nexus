<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>M-NEXUS — Education Service</title>
  <meta name="description" content="Cuaderno, calendario, asignaturas y tutor IA para cualquier carrera (Medicina, Ingeniería, Derecho, ADE…). Tablet-first con soporte de stylus." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <!-- One theme-color, matching --m-bg. There were two and the first
       said #0f1115, which is not the background the app actually paints. -->
  <meta name="theme-color" content="#08080e" />
  <!-- v2.38.2: iPad and iPhone ignore most of the web app manifest and
       read these instead. Without apple-mobile-web-app-status-bar-style
       the status bar sits over the app bar; without the title the home
       screen icon is called "index.html". -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="M-NEXUS" />
  <meta name="application-name" content="M-NEXUS" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/notebook.css" />
  <link rel="stylesheet" href="/src/styles/notes-doc.css" />
  <link rel="stylesheet" href="/src/styles/calendar.css" />
  <link rel="stylesheet" href="/src/styles/print.css" />
  <link rel="stylesheet" href="/src/styles/floating_window.css" />
  <link rel="stylesheet" href="/src/styles/popups.css" />
  <link rel="stylesheet" href="/src/styles/tour.css" />
  <link rel="stylesheet" href="/src/styles/mobile.css" />
</head>
<body>
  <!-- v1.0.0 — entry point. Router + bootstrap -->
  <div id="app" class="app" data-route="overview"></div>
  <!-- v1.5.x: hamburger drawer (mobile only) -->
  <button class="hamburger" id="hamburger" aria-label="Menu">≡</button>
  <!-- v2.4.0: hamburger button to expand collapsed dock (always visible when dock is hidden) -->
  <button class="dock-expand" id="dock-expand" aria-label="Show menu">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <nav class="dock" id="dock" aria-label="Primary">
    <a href="#/overview" class="dock-item" data-route="overview"><span class="i" data-icon="overview"></span><span class="lbl" data-i18n="dock.overview">Overview</span></a>
    <a href="#/calendar" class="dock-item" data-route="calendar"><span class="i" data-icon="calendar"></span><span class="lbl" data-i18n="dock.calendar">Calendar</span></a>
    <a href="#/subjects" class="dock-item" data-route="subjects"><span class="i" data-icon="subjects"></span><span class="lbl" data-i18n="dock.subjects">Subjects</span></a>
    <a href="#/notes"    class="dock-item" data-route="notes"><span class="i" data-icon="notes"></span><span class="lbl" data-i18n="dock.notes">Notes</span></a>
    <a href="#/capture"  class="dock-item" data-route="capture"><span class="i" data-icon="todos"></span><span class="lbl" data-i18n="dock.capture">Captura</span></a>
    <a href="#/rag"      class="dock-item" data-route="rag"><span class="i" data-icon="ai"></span><span class="lbl" data-i18n="dock.rag">Preguntar</span></a>
    <a href="#/ai"       class="dock-item" data-route="ai"><span class="i" data-icon="tutor"></span><span class="lbl" data-i18n="dock.tutor">AI</span></a>
    <a href="#/settings" class="dock-item" data-route="settings"><span class="i" data-icon="settings"></span><span class="lbl" data-i18n="dock.settings">Settings</span></a>
  </nav>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
