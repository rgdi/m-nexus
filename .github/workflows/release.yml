# GitHub Actions: Release
# Se ejecuta cuando se pushea un tag v*.*.* (ej. v0.28.0).
# Construye el plugin, el backend, y la app Android companion.
# Sube los ZIPs/APK a una release de GitHub.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# v0.29.6: workaround for fine-grained PAT that doesn't trigger tag-push events.
# The release workflow now runs on push to main, then figures out the version
# by reading git tags inside the jobs.
jobs:
  # ─────────────────────────────────────────────────────────────────
  # 0. Determine version from latest tag
  # ─────────────────────────────────────────────────────────────────
  set-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref_name: ${{ steps.v.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest tag
        id: v
        run: |
          # v0.29.6: when triggered by tag push, GITHUB_REF_NAME is the tag.
          # When triggered by main push, we need to read the latest tag from git.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
            VERSION="${LATEST_TAG#v}"
            REF_NAME="${LATEST_TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VERSION}"

  # ─────────────────────────────────────────────────────────────────
  # 1. Plugin de Obsidian → ZIP con 4 archivos
  # ─────────────────────────────────────────────────────────────────
  build-plugin:
    name: Build Obsidian Plugin
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify working directory and files
        run: |
          pwd
          ls -la
          echo "---"
          ls -la obsidian-plugin/src/coverage/ 2>&1
          echo "---"
          head -3 obsidian-plugin/src/coverage/auditor.ts
      - run: cd obsidian-plugin && npm install --no-audit --no-fund
      - name: Bundle plugin
        run: cd obsidian-plugin && npx esbuild src/main.ts --bundle --format=cjs --target=es2020 --platform=node --external:obsidian --external:electron --outfile=dist/main.js
      - name: Package ZIP
        run: |
          mkdir -p artifacts
          cd obsidian-plugin/dist
          zip ../../artifacts/m-nexus-plugin-${{ needs.set-version.outputs.ref_name }}.zip \
            main.js manifest.json styles.css versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/m-nexus-plugin-*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # 2. Backend Node.js → ZIP con dist/ + package.json
  # ─────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: cd backend && npx tsc
      - name: Package ZIP
        run: |
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist/ package.json deploy/
          cd deploy
          zip -r ../../artifacts/m-nexus-backend-${{ needs.set-version.outputs.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # 3. Companion App Android → APK
  # ─────────────────────────────────────────────────────────────────
  build-companion:
    name: Build Companion App
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Get dependencies
        run: cd companion-app && flutter pub get
      - name: Analyze
        run: cd companion-app && flutter analyze
      - name: Test
        run: cd companion-app && flutter test
      - name: Save custom build.gradle files
        run: |
          # Save the custom build.gradle files BEFORE flutter create overwrites them.
          cp companion-app/android/app/build.gradle /tmp/build.gradle
          echo "Saved $(wc -l < /tmp/build.gradle) lines of app/build.gradle"
          # Create the root build.gradle (which the repo is missing)
          cat > /tmp/root-build.gradle << 'EOF'
// M-NEXUS Installer — root build file.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "mnexus_installer"
EOF
          echo "Created /tmp/root-build.gradle ($(wc -l < /tmp/root-build.gradle) lines)"

          # v0.29.1: settings.gradle with Kotlin 1.9.22 plugin version.
          # Flutter 3.24+ requires the Kotlin plugin version to be specified
          # in the settings.gradle plugins block, otherwise it defaults to 1.7.1
          # which can't read the 1.9.0 metadata in shared_preferences_android.
          cat > /tmp/settings.gradle << 'EOF'
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-plugin-loader" version "1.0.0"
        id "com.android.application" version "8.3.0" apply false
        // v0.29.1: pin Kotlin plugin to 1.9.22
        id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    }
}

include ":app"
EOF
          echo "Created /tmp/settings.gradle ($(wc -l < /tmp/settings.gradle) lines)"

          # v0.29.1: gradle.properties with AndroidX + JVM 17
          cat > /tmp/gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
EOF
          echo "Created /tmp/gradle.properties"
      - name: Regenerate Android platform files (the repo has incomplete android/ folder)
        run: |
          cd companion-app
          # Backup our actual MainActivity
          if [ -f android/app/src/main/kotlin/com/mnexus/installer/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/mnexus/installer/MainActivity.kt /tmp/MainActivity.kt
          fi
          # Regenerate the android/ folder (this fixes the missing settings.gradle, gradle wrapper, etc.)
          flutter create --platforms=android --org com.mnexus --project-name mnexus_installer .
          # Restore our actual MainActivity (flutter create may overwrite it)
          if [ -f /tmp/MainActivity.kt ]; then
            cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/mnexus/installer/MainActivity.kt
          fi
          # v0.29.1: restore our custom build files
          if [ -f /tmp/build.gradle ]; then
            cp /tmp/build.gradle android/app/build.gradle
            echo "Restored custom app/build.gradle"
          fi
          if [ -f /tmp/root-build.gradle ]; then
            cp /tmp/root-build.gradle android/build.gradle
            echo "Installed root android/build.gradle"
          fi
          if [ -f /tmp/settings.gradle ]; then
            cp /tmp/settings.gradle android/settings.gradle
            echo "Installed android/settings.gradle"
          fi
          if [ -f /tmp/gradle.properties ]; then
            cp /tmp/gradle.properties android/gradle.properties
            echo "Installed android/gradle.properties"
          fi
      - name: Patch record_android build.gradle (workaround for v2 embedding issue)
        run: |
          # v0.29.1: record_android 1.5.2 uses the legacy Flutter Gradle API
          # (`flutter.ndkVersion`, `flutter.compileSdkVersion`) which fails with
          # 'Build failed due to use of deleted Android v1 embedding' in modern
          # Flutter scaffolds. Patch the file to use literal values.
          #
          # Find the pub-cache path used by this workflow.
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          RECORD_BUILD="$PUB_CACHE_DIR/hosted/pub.dev/record_android-1.5.2/android/build.gradle"
          if [ ! -f "$RECORD_BUILD" ]; then
            # Try resolving via flutter pub cache
            RECORD_BUILD=$(find "$PUB_CACHE_DIR" -path "*record_android*/android/build.gradle" 2>/dev/null | head -1)
          fi
          echo "Patching: $RECORD_BUILD"
          if [ -f "$RECORD_BUILD" ]; then
            # Replace `flutter.ndkVersion` with the literal value.
            sed -i "s|flutter\\.ndkVersion|'27.0.12077973'|g" "$RECORD_BUILD"
            # Replace `flutter.compileSdkVersion` with literal 34.
            sed -i "s|flutter\\.compileSdkVersion|34|g" "$RECORD_BUILD"
            # Replace `flutter.minSdkVersion` with literal 23.
            sed -i "s|flutter\\.minSdkVersion|23|g" "$RECORD_BUILD"
            # Replace `flutter.targetSdkVersion` with literal 34.
            sed -i "s|flutter\\.targetSdkVersion|34|g" "$RECORD_BUILD"
            echo "Patched successfully"
            grep -E "ndkVersion|compileSdkVersion|minSdkVersion|targetSdkVersion" "$RECORD_BUILD" | head -5
          else
            echo "WARNING: Could not find record_android build.gradle to patch"
            find "$PUB_CACHE_DIR" -name "record_android*" 2>/dev/null | head -3
          fi
      - name: Patch shared_preferences_android (kotlin 1.9.0 metadata)
        run: |
          # v0.29.1: shared_preferences_android 2.4.7 was compiled with Kotlin 1.9.0
          # but the default Flutter 3.24 scaffold ships Kotlin 1.7.1 → incompatible.
          # Patch the build.gradle to force a compatible Kotlin version.
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          for f in $(find "$PUB_CACHE_DIR" -path "*shared_preferences_android*/android/build.gradle" 2>/dev/null); do
            echo "Patching shared_preferences: $f"
            # Add a buildscript that pins Kotlin to 1.9.22 if not present.
            if ! grep -q "kotlin_version" "$f"; then
              sed -i '1i buildscript { ext.kotlin_version = "1.9.22" }' "$f"
            fi
          done
      - name: Build APK
        run: cd companion-app && flutter build apk --release --build-name=${GITHUB_REF_NAME#v} --build-number=${GITHUB_RUN_NUMBER}
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: companion-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # 4. Install script (lo descargamos tal cual del repo)
  # ─────────────────────────────────────────────────────────────────
  upload-installer:
    name: Upload Install Script
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: install/install.sh
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # 5. Crear la release de GitHub con todos los assets
  # ─────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [set-version, build-plugin, build-backend, build-companion, upload-installer]
    runs-on: ubuntu-latest
    steps:
      # v0.29: download-artifact v4 creates subdirs per artifact name.
      # We download each artifact into the parent artifacts/ dir using
      # merge-multiple: true, then move them up so the release patterns match.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts_tmp
          merge-multiple: true
      - name: Flatten artifact directories
        run: |
          mkdir -p artifacts
          # Move every downloaded file up to artifacts/
          find artifacts_tmp -type f -exec mv {} artifacts/ \;
          rm -rf artifacts_tmp
          ls -la artifacts/
      - name: Rename APK
        run: |
          if [ -f artifacts/app-release.apk ]; then
            mv artifacts/app-release.apk artifacts/m-nexus-companion-${{ needs.set-version.outputs.ref_name }}.apk
            # Sin versión para quicklinks
            cp artifacts/m-nexus-companion-${{ needs.set-version.outputs.ref_name }}.apk artifacts/m-nexus-companion.apk
          fi
      - name: Rename install script
        run: |
          if [ -f artifacts/install.sh ]; then
            mv artifacts/install.sh artifacts/m-nexus-install-${{ needs.set-version.outputs.ref_name }}.sh
            # Sin versión para quicklinks
            cp artifacts/m-nexus-install-${{ needs.set-version.outputs.ref_name }}.sh artifacts/m-nexus-install.sh
          fi
      - name: Duplicate ZIPs sin versión (para quicklinks)
        run: |
          for f in artifacts/m-nexus-plugin-${{ needs.set-version.outputs.ref_name }}.zip artifacts/m-nexus-backend-${{ needs.set-version.outputs.ref_name }}.zip; do
            if [ -f "$f" ]; then
              # Quita "-vX.Y.Z" del nombre
              base=$(basename "$f" | sed "s/-${{ needs.set-version.outputs.ref_name }}//")
              cp "$f" "artifacts/$base"
              echo "Duplicado: $f → artifacts/$base"
            fi
          done
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-plugin-*.zip
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-companion-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
