# GitHub Actions: M-NEXUS Auto Release
#
# v2.1.4: Reemplazado Flutter build (descatalogado en v2.0.0) por
#         webview bundle (scripts/build_webview.sh). El bundle es
#         un solo archivo HTML+CSS+JS autocontenido (612 KB) que
#         funciona en Capacitor/Cordova/WebView nativo.
#
# Trigger: push a main
# Comportamiento:
#   1. Detecta nueva version en backend/package.json
#   2. Si cambio: build backend ZIP + webview bundle
#   3. Crea tag y GitHub Release con todos los assets
#   4. Si NO cambio: solo CI tests

name: "M-NEXUS Auto Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar release aunque la versión no haya cambiado'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from backend/package.json
        id: parse
        run: |
          set -e
          VERSION=$(grep '"version"' backend/package.json | head -1 | awk -F'"' '{print $4}')
          if [[ -z "$VERSION" ]]; then
            echo "::error::No se pudo parsear la version de backend/package.json"
            exit 1
          fi
          TAG="v${VERSION}"
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          LATEST_TAG_DISPLAY="${LATEST_TAG:-<none>}"
          if [[ "$LATEST_TAG" == "$TAG" && "${{ inputs.force }}" != "true" ]]; then
            SHOULD_RELEASE="false"
            echo "Version ${VERSION} ya publicada como ${LATEST_TAG} - skip"
          else
            SHOULD_RELEASE="true"
            echo "Nueva version: ${TAG} (ultimo tag: ${LATEST_TAG_DISPLAY})"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. Build backend ZIP (~30s)
  # =========================================================================
  build-backend:
    name: Build backend ZIP
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      # v2.16.0: tsc has 32 pre-existing implicit-any errors. Build emits JS
      # anyway (TypeScript downgrades type errors to warnings in default mode)
      # so we tolerate the typecheck noise here as well as in ci.yml.
      - run: cd backend && npx tsc || echo "::warning::tsc had type errors — proceeding with JS emit"
      - name: Package backend ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist package.json deploy/
          cd deploy
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-backend.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. Build webview bundle (~20s, v2.0.0+)
  # =========================================================================
  build-webview:
    name: Build webview bundle
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: npm install esbuild --no-audit --no-fund
      - name: Build bundle
        run: bash scripts/build_webview.sh /tmp/webview-bundle
      - name: Package bundle ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd /tmp/webview-bundle
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-webview-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-webview-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-webview.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: webview
          path: artifacts/m-nexus-webview-*.zip
          if-no-files-found: error

  # =========================================================================
  # 3. Docker image (optional, continue-on-error)
  # =========================================================================
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          docker build \
            --tag "mnexus/backend:${TAG}" \
            --tag "mnexus/backend:latest" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/rgdi/m-nexus" \
            --label "org.opencontainers.image.title=M-NEXUS" \
            .
      - name: Test Docker image
        # v2.16.0: Dockerfile exposes PORT 4100 (not 3000 like legacy).
        run: |
          docker run -d --name mnexus-test -p 4100:4100 -e JWT_SECRET=ci-test-secret-12345678 mnexus/backend:latest
          sleep 8
          curl -f http://localhost:4100/api/v1/health || (docker logs mnexus-test; exit 1)
          docker stop mnexus-test
          docker rm mnexus-test

  # =========================================================================
  # 4. Create GitHub Release
  # =========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-version, build-backend, build-webview]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          for sub in backend webview; do
            if [ -d "artifacts/$sub" ]; then
              mv "artifacts/$sub"/* artifacts/ 2>/dev/null || true
              rm -rf "artifacts/$sub"
            fi
          done
          echo "=== Final artifacts ==="
          ls -la artifacts/

      # v2.1.5+ W3: generate SHA256SUMS.txt for supply-chain verification.
      # Format: "<sha>  " per line (matches `sha256sum -c` expectations).
      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          # Filter to ZIP files only
          : > SHA256SUMS.txt
          for f in *.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-webview-*.zip
            artifacts/m-nexus-webview.zip
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
