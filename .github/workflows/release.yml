# GitHub Actions: M-NEXUS Auto Release
#
# v0.46.2: Sistema de versionado automático.
#
# Trigger: push a main (cualquier cambio).
# Comportamiento:
#   1. Lee la versión de app/pubspec.yaml (FUENTE DE VERDAD).
#   2. Compara con el último tag v*.*.* en el repo.
#   3. Si la versión cambió (o no hay tag para esa versión):
#      a) Construye backend (TypeScript → JS)
#      b) Construye APK release (firmado)
#      c) Construye APK debug (para diagnostic)
#      d) Empaqueta installer
#      e) Crea tag vX.Y.Z si no existe
#      f) Crea/actualiza GitHub Release con todos los assets
#   4. Si la versión NO cambió: skip (solo CI corre los tests).
#
# Version bump: simplemente edita app/pubspec.yaml y backend/package.json
#   (mismo número) → push a main → CI hace el resto automáticamente.
#
# No se necesita crear tags manualmente ni correr workflows externos.

name: "M-NEXUS Auto Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar release aunque la versión no haya cambiado'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. Detectar si hay nueva versión
  # =========================================================================
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from pubspec.yaml
        id: parse
        run: |
          set -e
          # Lee la versión del pubspec.yaml (formato: version: 0.46.1+57)
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}' | sed 's/+.*//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::No se pudo parsear la versión de app/pubspec.yaml"
            exit 1
          fi
          TAG="v${VERSION}"

          # Verifica que backend/package.json tenga la misma versión (consistencia)
          BACKEND_VERSION=$(grep '"version"' backend/package.json | head -1 | awk -F'"' '{print $4}')
          if [[ -n "$BACKEND_VERSION" && "$BACKEND_VERSION" != "$VERSION" ]]; then
            echo "::warning::backend (${BACKEND_VERSION}) != frontend (${VERSION})"
            echo "::warning::Usando versión del frontend"
          fi

          # Compara con el último tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          if [[ "$LATEST_TAG" == "$TAG" && "${{ inputs.force }}" != "true" ]]; then
            SHOULD_RELEASE="false"
            echo "Version ${VERSION} ya publicada como ${LATEST_TAG} — skip"
          else
            SHOULD_RELEASE="true"
            echo "Nueva versión: ${TAG} (último tag: ${LATEST_TAG:-ninguno})"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. Build backend (ZIP con dist/ + package.json)
  # =========================================================================
  build-backend:
    name: Build backend ZIP
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc
      - name: Create backend ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist package.json deploy/
          cd deploy
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" .
          # Quicklink "latest" para URLs cortas
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-backend.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. Build APKs (release + debug) en paralelo
  # =========================================================================
  build-apk:
    name: Build APKs (release + debug)
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Cache solo pub (NO gradle — el auditor bug #5 fue por cache corrupto de gradle)
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # v0.46: limpia TODO antes de build (auditor bug #5 fix)
      - name: Clean stale build artifacts
        run: |
          echo "=== Cleaning ==="
          cd app
          flutter clean
          rm -rf ~/.gradle/caches/ 2>/dev/null || true
          rm -rf .dart_tool/ 2>/dev/null || true
          rm -rf build/ 2>/dev/null || true
          rm -rf android/.gradle 2>/dev/null || true
          rm -rf android/app/build 2>/dev/null || true
          echo "=== Clean done ==="

      - name: Install dependencies
        run: cd app && flutter pub get

      # Drift requires build_runner to generate *.g.dart files before any
      # code that depends on the generated code (e.g. AppDb, NotesCompanion)
      # can be analyzed. Without this, 'flutter analyze' fails on missing
      # generated members like customStatement(), select(), etc.
      - name: Generate Drift code (build_runner)
        run: cd app && dart run build_runner build --delete-conflicting-outputs

      # Sincroniza versionName/versionCode del pubspec al android/app/build.gradle
      # (así el APK muestra el número correcto en Ajustes → Aplicaciones)
      - name: Sync version to Android
        run: |
          set -e
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION" | sed 's/+.*//')
          VERSION_CODE=$(echo "$VERSION" | sed 's/.*+//')
          echo "Setting versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/android/app/build.gradle
          sed -i "s/versionName = .*/versionName = \"${VERSION_NAME}\"/" app/android/app/build.gradle
          # Genera l10n
          cd app && flutter gen-l10n || echo "l10n skipped (no ARB changes)"

      # Genera locales (necesario para MaterialLocalizations)
      - name: Generate localization
        run: cd app && flutter gen-l10n

      - name: Analyze (warn-only)
        run: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings || echo "::warning::Analyze issues (non-fatal)"

      - name: Run tests (warn-only)
        run: cd app && flutter test --no-pub --reporter=expanded || echo "::warning::Tests failed but continuing (build APK anyway)"

      # Build ambos APKs. Si uno falla, igual queremos el otro.
      - name: Build release APK
        id: build_release
        run: |
          set +e
          cd app
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build-release.log
          STATUS=$?
          if [ $STATUS -eq 0 ] && [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "::notice::Release APK built successfully"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK build failed (continuing with debug only)"
            tail -30 /tmp/build-release.log
          fi
          exit 0

      - name: Build debug APK
        id: build_debug
        run: |
          set +e
          cd app
          flutter build apk --debug --no-tree-shake-icons 2>&1 | tee /tmp/build-debug.log
          STATUS=$?
          if [ $STATUS -eq 0 ] && [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "::notice::Debug APK built successfully"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Debug APK build failed"
            tail -30 /tmp/build-debug.log
          fi
          exit 0

      - name: Copy APKs to artifacts
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts

          RELEASE_APK="app/build/app/outputs/flutter-apk/app-release.apk"
          DEBUG_APK="app/build/app/outputs/flutter-apk/app-debug.apk"

          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/m-nexus-app-${TAG}-release.apk"
            cp "$RELEASE_APK" "artifacts/m-nexus-app.apk"
            echo "Release APK: $(du -h $RELEASE_APK | cut -f1)"
          fi

          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/m-nexus-app-${TAG}-debug.apk"
            echo "Debug APK: $(du -h $DEBUG_APK | cut -f1)"
          fi

          if [ ! -f "$RELEASE_APK" ] && [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Neither release nor debug APK was produced"
            exit 1
          fi

          echo "=== Artifacts ==="
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: artifacts/m-nexus-app-*.apk
          if-no-files-found: error

  # =========================================================================
  # 3. Empaquetar installer
  # =========================================================================
  build-installer:
    name: Package installer
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Copy installer
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cp install/install.sh "artifacts/m-nexus-install-${TAG}.sh"
          cp install/install.sh "artifacts/m-nexus-install.sh"
          chmod +x artifacts/m-nexus-install-*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/m-nexus-install-*.sh
          if-no-files-found: error

  # =========================================================================
  # 4. Create / update GitHub Release
  # =========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-version, build-backend, build-apk, build-installer]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          # Mueve todo a artifacts/ root (upload-artifact crea subdirs por nombre)
          for sub in app backend installer; do
            if [ -d "artifacts/$sub" ]; then
              mv "artifacts/$sub"/* artifacts/ 2>/dev/null || true
              rm -rf "artifacts/$sub"
            fi
          done
          echo "=== Final artifacts ==="
          ls -la artifacts/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-install.sh
            artifacts/m-nexus-app-*.apk
            artifacts/m-nexus-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🎉 Release ${{ needs.detect-version.outputs.tag }} publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY
