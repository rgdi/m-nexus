# GitHub Actions: M-NEXUS Auto Release (optimized for speed)
#
# v0.46.7: Sistema de versionado 100% automatico con optimizaciones de velocidad.
#
# Trigger: push a main
# Comportamiento:
#   1. Detecta nueva version en app/pubspec.yaml
#   2. Si cambio: build backend, APKs (release + debug), installer
#   3. Crea tag y GitHub Release con todos los assets
#   4. Si NO cambio: solo CI tests
#
# Optimizaciones de velocidad:
#   - Cache gradle (ademas de pub)
#   - Build debug Y release en paralelo (con matrix)
#   - No flutter clean (usa cache)
#   - Skip analyze y tests si --skip-validation flag

name: "M-NEXUS Auto Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar release aunque la versión no haya cambiado'
        required: false
        default: 'false'
        type: boolean
      skip_validation:
        description: 'Skip analyze + tests (mas rapido)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. Detectar version
  # =========================================================================
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from pubspec.yaml
        id: parse
        run: |
          set -e
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}' | sed 's/+.*//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::No se pudo parsear la version de app/pubspec.yaml"
            exit 1
          fi
          TAG="v${VERSION}"
          BACKEND_VERSION=$(grep '"version"' backend/package.json | head -1 | awk -F'"' '{print $4}')
          if [[ -n "$BACKEND_VERSION" && "$BACKEND_VERSION" != "$VERSION" ]]; then
            echo "::warning::backend (${BACKEND_VERSION}) != frontend (${VERSION})"
          fi
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          if [[ "$LATEST_TAG" == "$TAG" && "${{ inputs.force }}" != "true" ]]; then
            SHOULD_RELEASE="false"
            echo "Version ${VERSION} ya publicada como ${LATEST_TAG} - skip"
          else
            SHOULD_RELEASE="true"
            echo "Nueva version: ${TAG} (ultimo tag: ${LATEST_TAG:-ninguno})"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. Build backend (rapido: ~30s)
  # =========================================================================
  build-backend:
    name: Build backend ZIP
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc
      - name: Package backend ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist package.json deploy/
          cd deploy
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-backend.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. Build APK release + debug en PARALELO (matrix)
  # =========================================================================
  build-apk:
    name: Build APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: release
            build_flag: --release
          - target: debug
            build_flag: --debug
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Cache pub (DRIFT y flutter packages)
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache gradle (OPTIMIZACION: gradle tarda 5-10 min sin cache)
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/build
          key: ${{ runner.os }}-gradle-${{ matrix.target }}-${{ hashFiles('app/android/app/build.gradle', 'app/android/build.gradle', 'app/android/settings.gradle', 'app/android/gradle.properties', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.target }}-
            ${{ runner.os }}-gradle-

      # Cache flutter (OPTIMIZACION: 200MB, ahorra 30s de download)
      - name: Cache flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.24.0-stable
          restore-keys: |
            ${{ runner.os }}-flutter-

      # v0.46.7: SKIP flutter clean - confiamos en gradle cache
      # Solo limpiar si los caches no se restauraron
      - name: Install dependencies
        run: cd app && flutter pub get

      # v0.46.7: drift codegen removed (drift dependency was removed)
      # If you need it back, add build_runner + drift_dev to dev_dependencies

      # Sync version del pubspec al android build.gradle
      - name: Sync version to Android
        run: |
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION" | sed 's/+.*//')
          VERSION_CODE=$(echo "$VERSION" | sed 's/.*+//')
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/android/app/build.gradle
          sed -i "s/versionName = .*/versionName = \"${VERSION_NAME}\"/" app/android/app/build.gradle

      # Build APK
      - name: Build ${{ matrix.target }} APK
        run: |
          set -e
          cd app
          echo "=== Building ${{ matrix.target }} APK ==="
          flutter build apk ${{ matrix.build_flag }} --no-tree-shake-icons 2>&1 | tee /tmp/build-${{ matrix.target }}.log
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Copy APK
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          APK=$(find . -name "app-${{ matrix.target }}.apk" 2>/dev/null | head -1)
          if [[ -n "$APK" && -f "$APK" ]]; then
            cp "$APK" "artifacts/m-nexus-app-${TAG}-${{ matrix.target }}.apk"
            if [[ "${{ matrix.target }}" == "release" ]]; then
              cp "$APK" "artifacts/m-nexus-app.apk"
            fi
            echo "${{ matrix.target }} APK: $(du -h $APK | cut -f1)"
          else
            echo "::error::${{ matrix.target }} APK no encontrado"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: artifacts/m-nexus-app-*.apk
          if-no-files-found: error

  # =========================================================================
  # 3. Installer (~3s)
  # =========================================================================
  build-installer:
    name: Package installer
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Copy installer
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cp install/install.sh "artifacts/m-nexus-install-${TAG}.sh"
          cp install/install.sh "artifacts/m-nexus-install.sh"
          chmod +x artifacts/m-nexus-install-*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/m-nexus-install-*.sh
          if-no-files-found: error

  # =========================================================================
  # 4. Create GitHub Release (~10s)
  # =========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-version, build-backend, build-apk, build-installer]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          for sub in app-release app-debug backend installer; do
            if [ -d "artifacts/$sub" ]; then
              mv "artifacts/$sub"/* artifacts/ 2>/dev/null || true
              rm -rf "artifacts/$sub"
            fi
          done
          echo "=== Final artifacts ==="
          ls -la artifacts/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-install.sh
            artifacts/m-nexus-app-*.apk
            artifacts/m-nexus-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "### Release ${{ needs.detect-version.outputs.tag }} publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY
