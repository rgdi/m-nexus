# GitHub Actions: Release
# Se ejecuta cuando se pushea un tag v*.*.* (ej. v0.28.0).
# Construye el backend y la app Android M-NEXUS (standalone).
# Sube los ZIPs/APK a una release de GitHub.

name: "M-NEXUS Release"

on:
  push:
    branches:
      - main

# v0.29.6: workaround for fine-grained PAT that doesn't trigger tag-push events.
# The release workflow now runs on push to main, then figures out the version
# by reading git tags inside the jobs.
jobs:
  # -----------------------------------------------------------------
  # 0. Determine version from latest tag
  # -----------------------------------------------------------------
  set-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_tag.outputs.version }}
      ref_name: ${{ steps.read_tag.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read latest tag
        id: read_tag
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
            VERSION="${LATEST_TAG#v}"
            REF_NAME="${LATEST_TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "ref_name=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Detected version: v${VERSION} (tag: ${REF_NAME})"

  # -----------------------------------------------------------------
  # 1. Plugin de Obsidian -> ZIP con 4 archivos
  # -----------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: cd backend && npx tsc
      - name: Package ZIP
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cd backend
          mkdir -p deploy
          cp -r dist/ package.json deploy/
          (cd deploy && zip -r $GITHUB_WORKSPACE/artifacts/m-nexus-backend-${{ needs.set-version.outputs.ref_name }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # -----------------------------------------------------------------
  # 3. Companion App Android -> APK
  # -----------------------------------------------------------------

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: cd app && flutter test --no-pub --reporter=expanded 2>&1 || true
      - name: Copy custom android files
        run: |
          # backup all custom android files
          cp app/android/build.gradle /tmp/build.gradle 2>/dev/null || true
          cp app/android/settings.gradle /tmp/settings.gradle 2>/dev/null || true
          cp app/android/gradle.properties /tmp/gradle.properties 2>/dev/null || true
          cp app/android/app/build.gradle.kts /tmp/app-build.gradle.kts 2>/dev/null || true
          cp app/android/app/build.gradle /tmp/app-build.gradle 2>/dev/null || true
          cp app/android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp -r app/android/app/src/main/kotlin /tmp/main-kotlin 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-anydpi-v26 /tmp/mipmap-anydpi-v26 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-mdpi /tmp/mipmap-mdpi 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-hdpi /tmp/mipmap-hdpi 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-xhdpi /tmp/mipmap-xhdpi 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-xxhdpi /tmp/mipmap-xxhdpi 2>/dev/null || true
          cp -r app/android/app/src/main/res/mipmap-xxxhdpi /tmp/mipmap-xxxhdpi 2>/dev/null || true
          cp -r app/android/app/src/main/res/drawable /tmp/drawable 2>/dev/null || true
          cp app/android/app/src/main/res/values/colors.xml /tmp/colors.xml 2>/dev/null || true
          cp app/android/app/src/main/res/xml/file_paths.xml /tmp/file_paths.xml 2>/dev/null || true
          # v0.32: backup release signing config so the APK is signed with the
          # same keystore on every build (so devices recognize updates).
          cp app/android/key.properties /tmp/key.properties 2>/dev/null || true
          cp -r app/android/keystores /tmp/keystores 2>/dev/null || true
      - name: Regenerate Android platform files
        run: cd app && flutter create --platforms=android --no-overwrite --project-name mnexus_app .
      - name: Restore custom android files
        run: |
          # restore the build configs
          cp /tmp/build.gradle app/android/build.gradle 2>/dev/null || true
          cp /tmp/settings.gradle app/android/settings.gradle 2>/dev/null || true
          cp /tmp/gradle.properties app/android/gradle.properties 2>/dev/null || true
          # restore the app build config (kts preferred)
          if [ -f /tmp/app-build.gradle.kts ]; then
            cp /tmp/app-build.gradle.kts app/android/app/build.gradle.kts
          elif [ -f /tmp/app-build.gradle ]; then
            cp /tmp/app-build.gradle app/android/app/build.gradle
          fi
          # v0.32: restore release signing config
          if [ -f /tmp/key.properties ]; then cp /tmp/key.properties app/android/key.properties; fi
          if [ -d /tmp/keystores ]; then cp -r /tmp/keystores app/android/; fi
          # restore MainActivity.kt + AndroidManifest.xml (v0.30+ have 3 platform channels)
          cp /tmp/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          if [ -d /tmp/main-kotlin ]; then
            mkdir -p app/android/app/src/main/kotlin
            cp -r /tmp/main-kotlin/. app/android/app/src/main/kotlin/ 2>/dev/null || true
          fi
          # restore the launcher icons
          if [ -d /tmp/mipmap-anydpi-v26 ]; then cp -r /tmp/mipmap-anydpi-v26 app/android/app/src/main/res/; fi
          if [ -d /tmp/mipmap-mdpi ]; then cp -r /tmp/mipmap-mdpi app/android/app/src/main/res/; fi
          if [ -d /tmp/mipmap-hdpi ]; then cp -r /tmp/mipmap-hdpi app/android/app/src/main/res/; fi
          if [ -d /tmp/mipmap-xhdpi ]; then cp -r /tmp/mipmap-xhdpi app/android/app/src/main/res/; fi
          if [ -d /tmp/mipmap-xxhdpi ]; then cp -r /tmp/mipmap-xxhdpi app/android/app/src/main/res/; fi
          if [ -d /tmp/mipmap-xxxhdpi ]; then cp -r /tmp/mipmap-xxxhdpi app/android/app/src/main/res/; fi
          if [ -d /tmp/drawable ]; then cp -r /tmp/drawable app/android/app/src/main/res/; fi
          if [ -f /tmp/colors.xml ]; then cp /tmp/colors.xml app/android/app/src/main/res/values/colors.xml; fi
          if [ -f /tmp/file_paths.xml ]; then cp /tmp/file_paths.xml app/android/app/src/main/res/xml/file_paths.xml; fi
          if [ -f /tmp/key.properties ]; then cp /tmp/key.properties app/android/key.properties; fi
          if [ -d /tmp/keystores ]; then cp -r /tmp/keystores app/android/; fi
      - name: Patch plugin build.gradle for AGP 8.3 compat
        run: bash app/android/fix-plugins.sh
      - name: Build APK
        continue-on-error: true
        run: cd app && flutter build apk --release
      - name: Copy APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          if [ ! -f app/build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "::error::APK not found at app/build/app/outputs/flutter-apk/app-release.apk"
            ls -la app/build/app/outputs/flutter-apk/ 2>/dev/null || true
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp app/build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/artifacts/m-nexus-app-${{ needs.set-version.outputs.ref_name }}.apk
          cp $GITHUB_WORKSPACE/artifacts/m-nexus-app-${{ needs.set-version.outputs.ref_name }}.apk $GITHUB_WORKSPACE/artifacts/m-nexus-app.apk
          echo "APK copied successfully:"
          ls -la $GITHUB_WORKSPACE/artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: artifacts/m-nexus-app-*.apk
          if-no-files-found: warn


  upload-installer:
    name: Upload Installer Script
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - name: Copy installer to artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp install/install.sh $GITHUB_WORKSPACE/artifacts/m-nexus-install-${{ needs.set-version.outputs.ref_name }}.sh
          cp install/install.sh $GITHUB_WORKSPACE/artifacts/m-nexus-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/m-nexus-install-*.sh
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-app, upload-installer]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact directories + create quicklinks
        run: |
          if [ -d artifacts/backend ]; then
            mv artifacts/backend/*.zip artifacts/ 2>/dev/null || true
            rm -rf artifacts/backend
          fi
          if [ -d artifacts/app ]; then
            mv artifacts/app/*.apk artifacts/ 2>/dev/null || true
            rm -rf artifacts/app
          fi
          if [ -d artifacts/installer ]; then
            mv artifacts/installer/*.sh artifacts/ 2>/dev/null || true
            rm -rf artifacts/installer
          fi
          # v0.31.0: also create quicklinks (no version) for each artifact
          for f in artifacts/m-nexus-backend-*.zip; do
            [ -f "$f" ] && cp "$f" "artifacts/m-nexus-backend.zip"
          done
          for f in artifacts/m-nexus-install-*.sh; do
            [ -f "$f" ] && cp "$f" "artifacts/m-nexus-install.sh"
          done
          for f in artifacts/m-nexus-app-*.apk; do
            [ -f "$f" ] && cp "$f" "artifacts/m-nexus-app.apk"
          done
          ls -la artifacts/
      - name: Determine and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Try to read the tag from outputs, or fall back to git
          if [ -n "${{ needs.set-version.outputs.ref_name }}" ]; then
            TAG="${{ needs.set-version.outputs.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
          fi
          echo "Using TAG: ${TAG}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG not found locally, creating and pushing"
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git tag -f "$TAG" HEAD
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG" || true
          fi
          # Set it for later steps
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: Delete existing release if present (so we can re-upload assets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --yes || true
          fi
          # Also delete remote tag so the next step re-pushes it (avoid stale ref)
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" :refs/tags/"$TAG" 2>/dev/null || true
      - name: Re-create tag pointing to current commit (force)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f "$TAG" HEAD
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" -f "$TAG"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-install.sh
            artifacts/m-nexus-app-*.apk
            artifacts/m-nexus-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
