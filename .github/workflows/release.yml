# GitHub Actions: Release
# Se ejecuta cuando se pushea un tag v*.*.* (ej. v0.28.0).
# Construye el plugin, el backend, y la app Android companion.
# Sube los ZIPs/APK a una release de GitHub.

name: "M-NEXUS Release"

on:
  push:
    branches:
      - main

# v0.29.6: workaround for fine-grained PAT that doesn't trigger tag-push events.
# The release workflow now runs on push to main, then figures out the version
# by reading git tags inside the jobs.
jobs:
  # -----------------------------------------------------------------
  # 0. Determine version from latest tag
  # -----------------------------------------------------------------
  set-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_tag.outputs.version }}
      ref_name: ${{ steps.read_tag.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read latest tag
        id: read_tag
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
            VERSION="${LATEST_TAG#v}"
            REF_NAME="${LATEST_TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "ref_name=${REF_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Detected version: v${VERSION} (tag: ${REF_NAME})"

  # -----------------------------------------------------------------
  # 1. Plugin de Obsidian -> ZIP con 4 archivos
  # -----------------------------------------------------------------
  build-plugin:
    name: Build Obsidian Plugin
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify working directory and files
        run: |
          pwd
          ls -la
          echo "---"
          ls -la obsidian-plugin/src/coverage/ 2>&1
          echo "---"
          head -3 obsidian-plugin/src/coverage/auditor.ts
      - run: cd obsidian-plugin && npm install --no-audit --no-fund
      - name: Bundle plugin
        run: cd obsidian-plugin && npx esbuild src/main.ts --bundle --format=cjs --target=es2020 --platform=node --external:obsidian --external:electron --outfile=dist/main.js
      - name: Package ZIP
        run: |
          mkdir -p artifacts
          cd obsidian-plugin/dist
          zip ../../artifacts/m-nexus-plugin-${{ needs.set-version.outputs.ref_name }}.zip \
            main.js manifest.json styles.css versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/m-nexus-plugin-*.zip
          if-no-files-found: error

  # -----------------------------------------------------------------
  # 2. Backend Node.js -> ZIP con dist/ + package.json
  # -----------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: cd backend && npx tsc
      - name: Package ZIP
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cd backend
          mkdir -p deploy
          cp -r dist/ package.json deploy/
          (cd deploy && zip -r $GITHUB_WORKSPACE/artifacts/m-nexus-backend-${{ needs.set-version.outputs.ref_name }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # -----------------------------------------------------------------
  # 3. Companion App Android -> APK
  # -----------------------------------------------------------------

  build-companion:
    name: Build Companion App
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cd companion-app && flutter pub get
      - run: cd companion-app && flutter analyze
      - run: cd companion-app && flutter test
      - name: Copy custom android files
        run: |
          cp companion-app/android/build.gradle /tmp/build.gradle
          cp companion-app/android/settings.gradle /tmp/settings.gradle 2>/dev/null || true
          cp companion-app/android/gradle.properties /tmp/gradle.properties 2>/dev/null || true
      - name: Regenerate Android platform files
        run: cd companion-app && flutter create --platforms=android --no-overwrite --project-name companion_app .
      - name: Restore custom android files
        run: |
          cp /tmp/build.gradle companion-app/android/build.gradle
          cp /tmp/settings.gradle companion-app/android/settings.gradle 2>/dev/null || true
          cp /tmp/gradle.properties companion-app/android/gradle.properties 2>/dev/null || true
      - name: Build APK
        continue-on-error: true
        run: cd companion-app && flutter build apk --release
      - name: Copy APK
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          if [ -f companion-app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp companion-app/build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/artifacts/m-nexus-companion-${{ needs.set-version.outputs.ref_name }}.apk
            cp $GITHUB_WORKSPACE/artifacts/m-nexus-companion-${{ needs.set-version.outputs.ref_name }}.apk $GITHUB_WORKSPACE/artifacts/m-nexus-companion.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: artifacts/m-nexus-companion-*.apk
          if-no-files-found: warn


  upload-installer:
    name: Upload Installer Script
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - name: Copy installer to artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp install/install.sh $GITHUB_WORKSPACE/artifacts/m-nexus-install-${{ needs.set-version.outputs.ref_name }}.sh
          cp install/install.sh $GITHUB_WORKSPACE/artifacts/m-nexus-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/m-nexus-install-*.sh
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-plugin, build-backend, build-companion, upload-installer]
    permissions:
      contents: write
    steps:
      - uses:       - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact directories
        run: |
          if [ -d artifacts/plugin ]; then
            mv artifacts/plugin/*.zip artifacts/ 2>/dev/null || true
            rm -rf artifacts/plugin
          fi
          if [ -d artifacts/backend ]; then
            mv artifacts/backend/*.zip artifacts/ 2>/dev/null || true
            rm -rf artifacts/backend
          fi
          if [ -d artifacts/companion ]; then
            mv artifacts/companion/*.apk artifacts/ 2>/dev/null || true
            rm -rf artifacts/companion
          fi
          if [ -d artifacts/installer ]; then
            mv artifacts/installer/*.sh artifacts/ 2>/dev/null || true
            rm -rf artifacts/installer
          fi
          ls -la artifacts/
      - name: Determine and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Try to read the tag from outputs, or fall back to git
          if [ -n "${{ needs.set-version.outputs.ref_name }}" ]; then
            TAG="${{ needs.set-version.outputs.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
          fi
          echo "Using TAG: ${TAG}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG not found locally, creating and pushing"
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git tag "$TAG"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG" || true
          fi
          # Set it for later steps
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-plugin-*.zip
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-companion-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
