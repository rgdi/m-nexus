# GitHub Actions: M-NEXUS Auto Release
#
# v2.21.1: Añadido job build-android que produce APK firmado de debug
#         + APK release sin firmar. Assets subidos a GitHub Release.
#         Compatible con Capacitor 8.5 (targetSdk 34, minSdk 21).
#
# Trigger: push a main
# Comportamiento:
#   1. Detecta nueva version en backend/package.json
#   2. Si cambio: build backend ZIP + webview bundle + Android APK (debug + release)
#   3. Crea tag y GitHub Release con todos los assets
#   4. Si NO cambio: solo CI tests

name: "M-NEXUS Auto Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar release aunque la versión no haya cambiado'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from backend/package.json
        id: parse
        run: |
          set -e
          VERSION=$(grep '"version"' backend/package.json | head -1 | awk -F'"' '{print $4}')
          if [[ -z "$VERSION" ]]; then
            echo "::error::No se pudo parsear la version de backend/package.json"
            exit 1
          fi
          TAG="v${VERSION}"
          # v2.23.1: detection is based on git diff of package.json — if the
          # version changed since the previous commit we trigger a release
          # (or if user forces via workflow_dispatch).
          PREVIOUS_VERSION=$(git show HEAD~1:backend/package.json 2>/dev/null | grep '"version"' | head -1 | awk -F'"' '{print $4}' || echo "")
          CURRENT_VERSION="$VERSION"
          if [[ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" || "${{ inputs.force }}" == "true" ]]; then
            SHOULD_RELEASE="true"
            echo "Cambio de version ${PREVIOUS_VERSION:-<none>} -> ${CURRENT_VERSION}. Release de ${TAG}"
          else
            SHOULD_RELEASE="false"
            echo "Sin cambio de version (${CURRENT_VERSION}). Skip build."
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. Build backend ZIP (~30s)
  # =========================================================================
  build-backend:
    name: Build backend ZIP
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc
      - name: Package backend ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist package.json deploy/
          cd deploy
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-backend.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. Build webview bundle (~20s, v2.0.0+)
  # =========================================================================
  build-webview:
    name: Build webview bundle
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: npm install esbuild --no-audit --no-fund
      - name: Build bundle
        run: bash scripts/build_webview.sh /tmp/webview-bundle
      - name: Package bundle ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd /tmp/webview-bundle
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-webview-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-webview-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-webview.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: webview
          path: artifacts/m-nexus-webview-*.zip
          if-no-files-found: error

  # =========================================================================
  # 3. Build Android APK (v2.21.1+, debug + release)
  # =========================================================================
  # Builds the Capacitor Android wrapper around the webview bundle.
  # - debug APK: signed with Android debug keystore (auto-generated by gradle)
  # - release APK: unsigned (for users who want to sign with their own keystore)
  # Output: ~6-15 MB per APK, uploaded as artifact + attached to release.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [detect-version, build-webview]
    if: needs.detect-version.outputs.should_release == 'true'
    # v2.23.1: build-android no longer blocks the GitHub Release —
    # if Android tooling fails, release still ships with backend+webview.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up JDK 21 (Capacitor 8.5 toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm deps (root + frontend)
        run: |
          # v2.23.1: install root deps (incl @capacitor/cli) + esbuild for bundling
          # Then frontend devDeps (vitest etc.).
          (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
          npm install esbuild --no-audit --no-fund
          (cd frontend && npm ci --no-audit --no-fund || (cd frontend && npm install --no-audit --no-fund))

      - name: Build webview bundle
        run: bash scripts/build_webview.sh /tmp/webview-bundle

      - name: Install Capacitor + sync
        run: |
          # v2.23.1: capacitor CLI is in root devDeps, installed already by the npm step above.
          # We just check it and run cap sync.
          if ! [ -f node_modules/@capacitor/cli/package.json ]; then
            echo "::error::@capacitor/cli not installed after npm step"
            exit 1
          fi
          npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" >> $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17 }}
          ANDROID_HOME: $ANDROID_HOME
          ANDROID_SDK_ROOT: $ANDROID_HOME

      - name: Build APK (release, unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace || echo "release build failed (expected without signing config), continuing"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17 }}
          ANDROID_HOME: $ANDROID_HOME
          ANDROID_SDK_ROOT: $ANDROID_HOME

      - name: Collect APKs
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd android/app/build/outputs/apk
          if [ -f debug/app-debug.apk ]; then
            cp debug/app-debug.apk "$GITHUB_WORKSPACE/artifacts/m-nexus-${TAG}-debug.apk"
            cp debug/app-debug.apk "$GITHUB_WORKSPACE/artifacts/m-nexus-debug.apk"
            echo "debug APK: $(stat -c%s "$GITHUB_WORKSPACE/artifacts/m-nexus-${TAG}-debug.apk") bytes"
          fi
          if [ -f release/app-release-unsigned.apk ]; then
            cp release/app-release-unsigned.apk "$GITHUB_WORKSPACE/artifacts/m-nexus-${TAG}-release-unsigned.apk"
            cp release/app-release-unsigned.apk "$GITHUB_WORKSPACE/artifacts/m-nexus-release-unsigned.apk"
            echo "release APK: $(stat -c%s "$GITHUB_WORKSPACE/artifacts/m-nexus-${TAG}-release-unsigned.apk") bytes"
          fi
          ls -la "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/m-nexus-*.apk
          if-no-files-found: error

  # =========================================================================
  # 4. Docker image (optional, continue-on-error)
  # =========================================================================
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          docker build \
            --tag "mnexus/backend:${TAG}" \
            --tag "mnexus/backend:latest" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/rgdi/m-nexus" \
            --label "org.opencontainers.image.title=M-NEXUS" \
            .
      - name: Test Docker image
        # v2.16.0: Dockerfile exposes PORT 4100 (not 3000 like legacy).
        run: |
          docker run -d --name mnexus-test -p 4100:4100 -e JWT_SECRET=ci-test-secret-12345678 mnexus/backend:latest
          sleep 8
          curl -f http://localhost:4100/api/v1/health || (docker logs mnexus-test; exit 1)
          docker stop mnexus-test
          docker rm mnexus-test

  # =========================================================================
  # 5. Create GitHub Release
  # =========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # v2.23.1: Android is optional. Backend + webview + docker (if any) is enough.
    needs: [detect-version, build-backend, build-webview]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          for sub in backend webview android; do
            if [ -d "artifacts/$sub" ]; then
              mv "artifacts/$sub"/* artifacts/ 2>/dev/null || true
              rm -rf "artifacts/$sub"
            fi
          done
          echo "=== Final artifacts ==="
          ls -la artifacts/

      # v2.1.5+ W3: generate SHA256SUMS.txt for supply-chain verification.
      # Format: "<sha>  " per line (matches `sha256sum -c` expectations).
      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          # Filter to ZIP + APK files
          : > SHA256SUMS.txt
          for f in *.zip *.apk; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-webview-*.zip
            artifacts/m-nexus-webview.zip
            artifacts/m-nexus-*-debug.apk
            artifacts/m-nexus-debug.apk
            artifacts/m-nexus-*-release-unsigned.apk
            artifacts/m-nexus-release-unsigned.apk
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
