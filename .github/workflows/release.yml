name: M-NEXUS Release
on:
  push:
    branches:
      - main
jobs:
  set-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref_name: ${{ steps.v.outputs.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest tag
        id: v
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REF_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.28.0")
            VERSION="${LATEST_TAG#v}"
            REF_NAME="${LATEST_TAG}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT

  build-plugin:
    name: Build Obsidian Plugin
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd obsidian-plugin && npm install --no-audit --no-fund
      - name: Bundle plugin
        run: cd obsidian-plugin && npx esbuild src/main.ts --bundle --format=cjs --target=es2020 --platform=node --external:obsidian --external:electron --outfile=dist/main.js
      - name: Package ZIP
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp obsidian-plugin/manifest.json obsidian-plugin/styles.css obsidian-plugin/versions.json obsidian-plugin/dist/
          (cd obsidian-plugin/dist && zip $GITHUB_WORKSPACE/artifacts/m-nexus-plugin-${{ needs.set-version.outputs.ref_name }}.zip main.js manifest.json styles.css versions.json)
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/m-nexus-plugin-*.zip
          if-no-files-found: error
