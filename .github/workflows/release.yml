# GitHub Actions: M-NEXUS Auto Release (optimized for speed)
#
# v0.46.7: Sistema de versionado 100% automatico con optimizaciones de velocidad.
#
# Trigger: push a main
# Comportamiento:
#   1. Detecta nueva version en app/pubspec.yaml
#   2. Si cambio: build backend, APKs (release + debug), installer
#   3. Crea tag y GitHub Release con todos los assets
#   4. Si NO cambio: solo CI tests
#
# Optimizaciones de velocidad:
#   - Cache gradle (ademas de pub)
#   - Build debug Y release en paralelo (con matrix)
#   - No flutter clean (usa cache)
#   - Skip analyze y tests si --skip-validation flag

name: "M-NEXUS Auto Release"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar release aunque la versión no haya cambiado'
        required: false
        default: 'false'
        type: boolean
      skip_validation:
        description: 'Skip analyze + tests (mas rapido)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. Detectar version
  # =========================================================================
  detect-version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Parse version from pubspec.yaml
        id: parse
        run: |
          set -e
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}' | sed 's/+.*//')
          if [[ -z "$VERSION" ]]; then
            echo "::error::No se pudo parsear la version de app/pubspec.yaml"
            exit 1
          fi
          TAG="v${VERSION}"
          BACKEND_VERSION=$(grep '"version"' backend/package.json | head -1 | awk -F'"' '{print $4}')
          # v0.47.19: FAIL si backend y frontend difieren (antes solo warning).
          # El install.sh de v0.47.16 genera backend/.env que asume VERSION
          # consistente. Si difieren, el APK release del frontend apunta a un
          # backend con código de versión distinta → comportamiento indefinido.
          if [[ -n "$BACKEND_VERSION" && "$BACKEND_VERSION" != "$VERSION" ]]; then
            echo "::error::backend (${BACKEND_VERSION}) != frontend (${VERSION})"
            echo "::error::Synchronize versions: bump both or roll back one."
            exit 1
          fi
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "")
          # v0.47.19: si no hay tags v* (repo recién clonado), no imprimir
          # 'ultimo tag: ' vacío. Usar placeholder descriptivo.
          LATEST_TAG_DISPLAY="${LATEST_TAG:-<none>}"
          if [[ "$LATEST_TAG" == "$TAG" && "${{ inputs.force }}" != "true" ]]; then
            SHOULD_RELEASE="false"
            echo "Version ${VERSION} ya publicada como ${LATEST_TAG} - skip"
          else
            SHOULD_RELEASE="true"
            echo "Nueva version: ${TAG} (ultimo tag: ${LATEST_TAG_DISPLAY})"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 1. Build backend (rapido: ~30s)
  # =========================================================================
  build-backend:
    name: Build backend ZIP
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc
      - name: Package backend ZIP
        run: |
          set -e
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cd backend
          mkdir -p deploy
          cp -r dist package.json deploy/
          cd deploy
          zip -r "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" .
          cp "$GITHUB_WORKSPACE/artifacts/m-nexus-backend-${TAG}.zip" "$GITHUB_WORKSPACE/artifacts/m-nexus-backend.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/m-nexus-backend-*.zip
          if-no-files-found: error

  # =========================================================================
  # 2. Build APK release + debug SECUENCIAL en mismo job (comparten cache)
  # v0.47.8: cambio de matrix a un solo job que compila ambos.
  # Razon: el cache de gradle pesa 5+ GB. Si release y debug corren
  # en runners separados, ambos descargan todo desde cero (2h c/u).
  # Secuencial: 1 runner, mismo cache, ~5-10 min total.
  # =========================================================================
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Cache pub
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache gradle (UNICA key compartida, no por target)
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/android/app/build.gradle', 'app/android/build.gradle', 'app/android/settings.gradle', 'app/android/gradle.properties', 'app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache flutter
      - name: Cache flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.24.0-stable
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Clean only app/build
        run: |
          rm -rf app/build
          rm -rf app/android/app/build
          echo "Cleaned app/build only (gradle cache preserved)"

      - name: Install dependencies
        run: cd app && flutter pub get

      # v0.47.20: inyectar release keystore desde GitHub Secrets.
      # El keystore se commitea como base64 (MN_KEYSTORE_BASE64) y los passwords
      # como secrets separados (MN_KEYSTORE_STORE_PASSWORD, MN_KEYSTORE_KEY_PASSWORD).
      # Si los secrets no están configurados, el build.gradle cae a debug keystore
      # (con warning) para que CI no rompa builds de desarrollo.
      # Ver AUDIT_REPORT.md SEC-1.
      #
      # v0.47.25: fix CI — secrets no se pueden usar en if: directamente.
      # Usar env var + test en script bash.
      - name: Setup release keystore
        env:
          MN_KEYSTORE_BASE64: ${{ secrets.MN_KEYSTORE_BASE64 }}
          MN_KEYSTORE_STORE_PASSWORD: ${{ secrets.MN_KEYSTORE_STORE_PASSWORD }}
          MN_KEYSTORE_KEY_PASSWORD: ${{ secrets.MN_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [[ -n "$MN_KEYSTORE_BASE64" ]]; then
            mkdir -p app/android/keystores
            echo "$MN_KEYSTORE_BASE64" | base64 -d > app/android/keystores/release.keystore
            chmod 600 app/android/keystores/release.keystore
            echo "Keystore restaurado desde secret. Size: $(stat -c %s app/android/keystores/release.keystore) bytes"
            # Guardar passwords en gradle.properties (que el build.gradle lee)
            sed -i "s|^appKeystoreStorePassword=.*|appKeystoreStorePassword=${MN_KEYSTORE_STORE_PASSWORD}|" app/android/gradle.properties
            sed -i "s|^appKeystoreKeyPassword=.*|appKeystoreKeyPassword=${MN_KEYSTORE_KEY_PASSWORD}|" app/android/gradle.properties
            echo "Passwords guardados en gradle.properties"
          else
            echo "MN_KEYSTORE_BASE64 no configurado - usando debug keystore (warning)"
            mkdir -p app/android/keystores
            echo "# MN_KEYSTORE_BASE64 not set - using debug keystore" > app/android/keystores/.placeholder
          fi

      # Sync version del pubspec al gradle.properties
      - name: Sync version to Android
        run: |
          VERSION=$(grep "^version:" app/pubspec.yaml | head -1 | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION" | sed 's/+.*//')
          VERSION_CODE=$(echo "$VERSION" | sed 's/.*+//')
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"
          sed -i "s|^appVersionCode=.*|appVersionCode=${VERSION_CODE}|" app/android/gradle.properties
          sed -i "s|^appVersionName=.*|appVersionName=${VERSION_NAME}|" app/android/gradle.properties
          echo "=== Updated gradle.properties ==="
          grep "^appVersion" app/android/gradle.properties

      # Build release APK (cachea gradle)
      - name: Build release APK
        run: |
          set -e
          cd app
          echo "=== Building release APK ==="
          if [[ ! -f /home/runner/.android/debug.keystore ]]; then
            echo "No hay keystore release ni debug - generando uno temporal"
            mkdir -p /home/runner/.android
            keytool -genkey -v -keystore /home/runner/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -1
          fi
          # Si no hay release keystore, copiar el debug como fallback
          if [[ ! -f app/android/keystores/release.keystore ]]; then
            cp /home/runner/.android/debug.keystore app/android/keystores/release.keystore
            chmod 600 app/android/keystores/release.keystore
            # Usar passwords del debug keystore
            sed -i "s|^appKeystoreStorePassword=.*|appKeystoreStorePassword=android|" app/android/gradle.properties
            sed -i "s|^appKeystoreKeyPassword=.*|appKeystoreKeyPassword=android|" app/android/gradle.properties
          fi
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee /tmp/build-release.log
        env:
          GRADLE_OPTS: "-Xmx4G"

      # Build debug APK (reusa cache de gradle del release)
      - name: Build debug APK
        run: |
          set -e
          cd app
          echo "=== Building debug APK ==="
          flutter build apk --debug --no-tree-shake-icons 2>&1 | tee /tmp/build-debug.log
        env:
          GRADLE_OPTS: "-Xmx4G"

      # Copy ambos APKs
      - name: Copy APKs
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          REL=$(find . -name "app-release.apk" 2>/dev/null | head -1)
          DBG=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          if [[ -n "$REL" && -f "$REL" ]]; then
            cp "$REL" "artifacts/m-nexus-app-${TAG}-release.apk"
            cp "$REL" "artifacts/m-nexus-app.apk"
            echo "release APK: $(du -h $REL | cut -f1)"
          else
            echo "::error::release APK no encontrado"
            exit 1
          fi
          if [[ -n "$DBG" && -f "$DBG" ]]; then
            cp "$DBG" "artifacts/m-nexus-app-${TAG}-debug.apk"
            echo "debug APK: $(du -h $DBG | cut -f1)"
          else
            echo "::error::debug APK no encontrado"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: artifacts/m-nexus-app-*.apk
          if-no-files-found: error

  # =========================================================================
  # 3. Installer (~3s)
  # =========================================================================
  build-installer:
    name: Package installer
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Copy installer
        run: |
          TAG="${{ needs.detect-version.outputs.tag }}"
          mkdir -p artifacts
          cp install/install.sh "artifacts/m-nexus-install-${TAG}.sh"
          cp install/install.sh "artifacts/m-nexus-install.sh"
          chmod +x artifacts/m-nexus-install-*.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/m-nexus-install-*.sh
          if-no-files-found: error

  # =========================================================================
  # 4. Create GitHub Release (~10s)
  # =========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect-version, build-backend, build-apk, build-installer]
    if: needs.detect-version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        run: |
          for sub in app backend installer; do
            if [ -d "artifacts/$sub" ]; then
              mv "artifacts/$sub"/* artifacts/ 2>/dev/null || true
              rm -rf "artifacts/$sub"
            fi
          done
          echo "=== Final artifacts ==="
          ls -la artifacts/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/m-nexus-backend-*.zip
            artifacts/m-nexus-backend.zip
            artifacts/m-nexus-install-*.sh
            artifacts/m-nexus-install.sh
            artifacts/m-nexus-app-*.apk
            artifacts/m-nexus-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "### Release ${{ needs.detect-version.outputs.tag }} publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          ls -la artifacts/ >> $GITHUB_STEP_SUMMARY
