# GitHub Actions: CI — Tests
# Se ejecuta en cada push y PR. Si falla, no se puede mergear.
name: CI

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install --no-audit --no-fund
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npm test

  test-companion-app:
    name: Test Companion App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cd companion-app && flutter pub get
      - run: cd companion-app && flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: cd companion-app && flutter test
