# GitHub Actions: CI — Tests
# Se ejecuta en cada push y PR. Si falla, no se puede mergear.
name: CI

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-obsidian-plugin:
    name: Test Obsidian Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd obsidian-plugin && npm install --no-audit --no-fund
      - run: cd obsidian-plugin && npx tsc --noEmit
      - run: cd obsidian-plugin && npm test
      - name: Build plugin
        run: cd obsidian-plugin && npx esbuild src/main.ts --bundle --format=cjs --target=es2020 --platform=node --external:obsidian --external:electron --outfile=dist/main.js

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd backend && npm install --no-audit --no-fund
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npm test

  test-companion-app:
    name: Test Companion App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - run: cd companion-app && flutter pub get
      - run: cd companion-app && flutter analyze
      - run: cd companion-app && flutter test
