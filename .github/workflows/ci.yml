# GitHub Actions: CI - Tests
# Se ejecuta en cada push y PR. Si falla, no se puede mergear.
#
# v2.1.4: añadido test-frontend (validations v12-v21) y test-e2e
#         para detectar regresiones en mobile + flujo completo.
name: CI

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npm test

  test-frontend:
    name: Test Frontend (validations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('app/test/validations/package.json') }}
          restore-keys: ${{ runner.os }}-npm-frontend-
      # v2.1.4: lightweight validation suite (no Flutter, no Playwright).
      # These are pure-Node tests that exercise the core business logic.
      - run: |
          for v in v12 v13 v14 v15_notes v15_advanced v16 v17 v18 v19 v20 v21 v211; do
            echo "=== validate_${v}.cjs ==="
            node app/test/validations/validate_${v}.cjs || exit 1
          done

  test-e2e-mobile:
    name: Test Mobile audit (3 viewports × 7 screens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt
          restore-keys: ${{ runner.os }}-apt-
      - name: Install Playwright + Python http server
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpangocairo-1.0-0 libpango-1.0-0 \
            python3
          npm install playwright@latest --no-audit --no-fund
          npx playwright install chromium
      - name: Start backend
        run: |
          cd backend && nohup bash ../scripts/start_backend.sh > /tmp/backend.log 2>&1 &
          sleep 5
          curl -fs http://localhost:4100/api/v1/health || (cat /tmp/backend.log && exit 1)
      - name: Start frontend
        run: |
          cd frontend/public && nohup python3 -m http.server 8080 > /tmp/frontend.log 2>&1 &
          sleep 3
          curl -fs http://localhost:8080/ > /dev/null || (cat /tmp/frontend.log && exit 1)
      - name: Run mobile audit
        env:
          CI: "true"
        run: node app/test/e2e/capture_all_mobile.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/mobile/

  test-docker:
    name: Build Docker image (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build --tag mnexus/test:latest .
      - name: Smoke test Docker image
        run: |
          docker run -d --name mnexus-test -p 3000:3000 mnexus/test:latest
          sleep 5
          curl -f http://localhost:3000/health || (docker logs mnexus-test; docker stop mnexus-test; docker rm mnexus-test; exit 1)
          docker stop mnexus-test
          docker rm mnexus-test
