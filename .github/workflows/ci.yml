# GitHub Actions: CI - Tests
# Runs on every push and PR. If it fails, the merge is blocked.
#
# v2.16.0: Complete rewrite. Old jobs referenced:
#   - `cd frontend/public` (empty after the v2.x restructure; frontend moved to `frontend/src/`)
#   - `validate_all.sh` (5/12 validations are obsolete from the legacy rewrite and failed)
#   - Hardcoded `chromium-1243` cache key in mobile audit (sandbox-specific)
#   - `app/test/validations/package.json` cache key (no such file; validations are .cjs scripts)
# Replaced with vitest (255 frontend tests passing) and a portable mobile audit script.
name: CI

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci --no-audit --no-fund
      - name: Typecheck
        # v2.17.0: we hit 0 type errors. tsc is now blocking — any regression
        # in type safety fails the build.
        run: cd backend && npx tsc --noEmit
      - name: Run vitest (930 tests)
        # v2.16.0: exclude syncE2E — requires real backend + 2 WS clients which is
        # complex to orchestrate in CI. Run separately in a follow-up job.
        run: cd backend && ./node_modules/.bin/vitest run --exclude="**/syncE2E.test.ts" --reporter=default

  test-frontend:
    name: Test Frontend (vitest 255)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --no-audit --no-fund
      - name: Run vitest (255 tests)
        # v2.16.0: frontend tests are now vitest-based, not legacy .cjs validations.
        run: cd frontend && ./node_modules/.bin/vitest run --reporter=default

  test-e2e-mobile:
    name: Mobile audit (3 viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Python http server
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpangocairo-1.0-0 libpango-1.0-0 \
            python3
          # v2.16.0: install playwright globally so capture_all_mobile.cjs
          # can require.resolve() it (also tried via local node_modules).
          npm install -g playwright --no-audit --no-fund
          npx playwright install chromium
      - name: Start backend
        env:
          JWT_SECRET: ci-test-secret-not-for-production-use-12345678
        run: |
          cd backend && nohup bash ../scripts/start_backend.sh > /tmp/backend.log 2>&1 &
          sleep 6
          curl -fs http://localhost:4100/api/v1/health || (cat /tmp/backend.log && exit 1)
      - name: Start frontend (v2.x serves from frontend/, not frontend/public)
        # v2.16.0: the legacy CI did `cd frontend/public && python3 -m http.server`
        # but frontend/public is empty (everything moved to frontend/src/).
        # Serve frontend/ directly so index.html resolves.
        run: |
          cd frontend && nohup python3 -m http.server 8080 > /tmp/frontend.log 2>&1 &
          sleep 3
          curl -fs http://localhost:8080/ > /dev/null || (cat /tmp/frontend.log && exit 1)
      - name: Run mobile audit (portable script, no hardcoded paths)
        env:
          CI: "true"
        run: node app/test/e2e/capture_all_mobile.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/mobile/

  test-docker:
    name: Build Docker image (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build --tag mnexus/test:latest .
      # v2.16.0: Dockerfile exposes PORT 4100 (was 3000 in legacy). Verify health.
      - name: Smoke test Docker image
        run: |
          docker run -d --name mnexus-test -p 4100:4100 -e JWT_SECRET=ci-test-secret-12345678 mnexus/test:latest
          sleep 8
          curl -f http://localhost:4100/api/v1/health || (docker logs mnexus-test; docker stop mnexus-test; docker rm mnexus-test; exit 1)
          docker stop mnexus-test
          docker rm mnexus-test

  build-android:
    # v2.18.0: Build the Capacitor-wrapped webview bundle as a debug APK.
    # Uploads app-debug.apk as a workflow artifact (~30 MB).
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '36'
          build-tools-version: '36.0.0'
      - name: Build webview bundle + cap add/sync
        run: bash scripts/build_android.sh bundle
      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK output
        run: ls -la android/app/build/outputs/apk/debug/ || (echo "APK missing"; exit 1)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mnexus-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
