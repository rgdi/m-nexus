# GitHub Actions: CI - Tests
# Se ejecuta en cada push y PR. Si falla, no se puede mergear.
name: CI

on:
  push:
    branches: [main, develop, 'v*']
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-backend-
      - run: cd backend && npm ci --no-audit --no-fund
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && npm test

  test-app:
    name: Test App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-flutter-app-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-app-
      - run: cd app && flutter pub get
      - name: Analyze
        run: cd app && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test

  test-docker:
    name: Build & test Docker (v0.62.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build --tag mnexus/test:latest .
      - name: Test Docker image
        run: |
          docker run -d --name mnexus-test -p 3000:3000 mnexus/test:latest
          sleep 5
          curl -f http://localhost:3000/health || (docker logs mnexus-test && exit 1)
          docker stop mnexus-test
          docker rm mnexus-test
        run: cd app && flutter test --no-pub --reporter=expanded
