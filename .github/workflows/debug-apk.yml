# GitHub Actions: Debug APK Build (manual diagnostic)
#
# v0.46.2: Herramienta de diagnóstico para builds rotos.
# Solo se ejecuta manualmente (workflow_dispatch).
# No interfiere con el release automático (release.yml).

name: "Debug APK Build"

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      skip_clean:
        description: 'Skip flutter clean (faster, but may use stale state)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build APK (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Clean (unless skipped)
        if: ${{ inputs.skip_clean != 'true' }}
        run: |
          cd app
          flutter clean
          rm -rf ~/.gradle/caches/ 2>/dev/null || true
          rm -rf .dart_tool/ 2>/dev/null || true
          rm -rf build/ 2>/dev/null || true

      - name: Install deps
        run: cd app && flutter pub get

      - name: Show environment
        run: |
          echo "=== Versions ==="
          java -version 2>&1
          flutter --version 2>&1
          node --version
          echo "=== ANDROID_HOME ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== Env vars ==="
          env | grep -E "(ANDROID|JAVA|FLUTTER|PATH)" | head -20

      - name: Build APK
        run: |
          set -e
          cd app
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          echo "=== Building $BUILD_TYPE APK ==="
          flutter build apk --$BUILD_TYPE --no-tree-shake-icons 2>&1 | tee /tmp/build.log
        env:
          GRADLE_OPTS: "-Xmx4G -Dorg.gradle.daemon=false"

      - name: Find and upload APK
        run: |
          mkdir -p artifacts
          echo "=== Searching for APK files ==="
          find . -name "*.apk" 2>/dev/null || true
          APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            echo "=== Last 100 lines of build log ==="
            tail -100 /tmp/build.log
            exit 1
          fi
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          cp "$APK_PATH" "artifacts/m-nexus-app-${BUILD_TYPE}.apk"
          echo "APK at: $APK_PATH"
          echo "Size: $(du -h artifacts/*.apk | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
