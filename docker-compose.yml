# docker-compose.yml para M-NEXUS (v2.23.2)
#
# Two services:
#   m-nexus-backend   — Express + ts server on 4100, persists data on a named volume.
#   m-nexus-frontend  — Nginx serving the static webview bundle + reverse-proxying
#                       /api/* to the backend. Single domain on 8080.
#
# Usage:
#   cp .env.example .env  && edit JWT_SECRET (use: openssl rand -hex 32)
#   docker compose up -d
#
# v2.23.2: webview bundle is baked into the frontend image at build time
# (mount ./public as a bind for live mode during development).

version: "3.9"

services:
  m-nexus-backend:
    image: ghcr.io/rgdi/m-nexus-backend:v2.23.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m-nexus-backend
    restart: unless-stopped
    ports:
      # Don't expose to host; nginx proxies /api/* from the frontend container.
      # Set to "127.0.0.1:4100:4100" if you want direct access for debugging.
      - "127.0.0.1:4100:4100"
    volumes:
      - mnexus-data:/data
      - mnexus-backups:/backups
    environment:
      NODE_ENV: production
      PORT: 4100
      HOST: 0.0.0.0
      DATA_DIR: /data
      BACKUP_DIR: /backups
      # Generate one with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set. Run: openssl rand -hex 32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - mnexus-net

  m-nexus-frontend:
    image: nginx:alpine
    container_name: m-nexus-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # WebView bundle served as static files.
      # For 'latest' version, ./public must already contain the contents of
      # m-nexus-webview-${TAG}.zip extracted there.
      # Install script auto-fills it via the `mount` profile.
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      m-nexus-backend:
        condition: service_healthy
    networks:
      - mnexus-net

volumes:
  mnexus-data:
    name: mnexus-data
  mnexus-backups:
    name: mnexus-backups

networks:
  mnexus-net:
    name: mnexus-net
    driver: bridge
