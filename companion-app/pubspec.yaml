name: mnexus_installer
description: "M-NEXUS — Tu segundo cerebro digital. Notas, flashcards, calendar. Standalone (Android + Web)."
version: 0.42.0+24
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Permisos y archivos
  path_provider: ^2.1.4
  # HTTP para descargar el plugin
  http: ^1.2.2
  # Storage paths
  path: ^1.9.0
  # UI
  cupertino_icons: ^1.0.8
  # v0.32: para abrir el GitHub y docs desde la app
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  # v0.32: para solicitar permisos de manera nativa
  permission_handler: ^11.3.1
  # v0.32: voice notes con speech_to_text 7.x (compatible Flutter 3.24 + AGP 8.3+)
  speech_to_text: ^7.0.0
  # v0.32: para reproducir grabaciones
  audioplayers: ^6.1.0

  # v0.31: para generar device_id persistente
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  # v0.30: render del changelog en el UpdateDialog
  flutter_markdown: ^0.7.4
  # Para extraer el ZIP del plugin
  archive: ^3.6.1
  # v0.28: para auto-update (consultar versión actual)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/release-info.json

# v0.32: voice notes con speech_to_text 7.x (compatible Flutter 3.24 + AGP 8.3+)
# Antes intenté `record` 5.x/6.x pero record_android 1.5.2 es incompatible con AGP 8.3
# y record_android 2.x requiere Dart 3.12+ (Flutter 3.27+)
# speech_to_text 7.0.0 es estable, simple y compatible con nuestro stack.
