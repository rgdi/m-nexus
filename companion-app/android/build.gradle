buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.9.22'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// v0.32: workaround para plugins viejos (speech_to_text 7.x, record 5.x, etc.)
// que usan 'flutter.x' (compileSdkVersion, ndkVersion, path) en sus
// build.gradle. AGP 8.x ya no expone automáticamente 'flutter' como
// property, así que lo inyectamos como ext property.
allprojects {
    ext.flutter = [
        compileSdkVersion: 34,
        ndkVersion: '26.1.10909125',
        minSdkVersion: 23,
        targetSdkVersion: 34,
    ]
}
