buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.9.22'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// v0.32: workaround para paquetes (speech_to_text, record, etc.) que usan
// la propiedad 'flutter' de la extensión 'android'. AGP 8.x ya no la expone
// automáticamente; este snippet la reinyecta como property del root project.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                if (project.android.metaClass.respondsTo(project.android, "getFlutter")) {
                    def flutterProp = rootProject.findProperty('flutter.path') ?: project.findProperty('flutter.path')
                    if (flutterProp) {
                        project.ext.flutter = [path: flutterProp]
                    }
                }
            }
        }
    }
}
