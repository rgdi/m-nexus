buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.9.22'
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// v0.32: workaround para paquetes (speech_to_text, record, etc.) que usan
// la propiedad 'flutter' de la extensión 'android'. AGP 8.x ya no la expone
// automáticamente. Inyectamos la property flutter.path en cada subproyecto
// antes de que se evalúen.

ext {
    flutterPath = { ->
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        return flutterSdkPath
    }
}

subprojects { project ->
    project.beforeEvaluate {
        // nothing
    }
    project.afterEvaluate {
        if (project.hasProperty("android")) {
            try {
                project.ext.flutter = [path: flutterPath()]
            } catch (Exception e) {
                // ignore
            }
        }
    }
}
