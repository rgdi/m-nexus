// M-NEXUS Installer — Android build config.

// v0.29.1: pin Kotlin plugin to 1.9.22 to match shared_preferences_android
// and other plugins compiled with newer Kotlin metadata.
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mnexus.installer"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.mnexus.installer"
        minSdk = 23
        targetSdk = 34
        versionCode = 28
        versionName = "0.28.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity:1.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
}

// v0.29.1: force all Kotlin stdlib + plugin versions to 1.9.22 so the app
// compiles against the same metadata version used by shared_preferences_android
// and other modern plugins.
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion kotlin_version
                details.because "Pin Kotlin to ${kotlin_version} to match shared_preferences_android metadata"
            }
        }
    }
}
