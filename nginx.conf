# Nginx config for M-NEXUS frontend container.
# v2.23.2: serves the webview bundle + reverse-proxies /api/* to backend.

worker_processes 4;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # gzip JS/CSS/JSON/etc.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        # Static webview (vue-less vanilla JS)
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint that doesn't require backend.
        location = /healthz {
            return 200 "ok\n";
        }

        # Cache-bust versioned assets, serve others with moderate cache.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Default: serve SPA fallback to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API + sync websocket to backend.
        location /api/ {
            proxy_pass http://m-nexus-backend:4100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://m-nexus-backend:4100;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
