org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# v0.46: workaround for APK pipeline broken (auditor bug #5).
# Disable gradle daemon in CI (causes stale state issues in fresh runners).
org.gradle.daemon=false
org.gradle.parallel=false

# v0.47.3: versionCode/versionName. Seteados por el CI o manualmente.
# El CI los lee de app/pubspec.yaml y los inyecta antes de build.
appVersionCode=1
appVersionName=0.0.0-dev

# v0.47.20: keystore credentials. Seteados por el CI desde GitHub Secrets.
# Si no, el build usa el debug keystore (con warning).
appKeystoreStorePassword=change-via-CI
appKeystoreKeyPassword=change-via-CI
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
