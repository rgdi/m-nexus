org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# v0.46: workaround for APK pipeline broken (auditor bug #5).
# Disable gradle daemon in CI (causes stale state issues in fresh runners).
org.gradle.daemon=false
org.gradle.parallel=false

# v0.47.3: versionCode/versionName. Seteados por el CI o manualmente.
# El CI los lee de app/pubspec.yaml y los inyecta antes de build.
appVersionCode=1
appVersionName=0.0.0-dev
