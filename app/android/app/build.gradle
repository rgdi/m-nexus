// M-NEXUS App — Android build config.

// v0.29.1: pin Kotlin plugin to 1.9.22 to match shared_preferences_android
// and other plugins compiled with newer Kotlin metadata.
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.mnexus.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.mnexus.app"
        minSdk = 23
        targetSdk = 34
        // v0.47.3: versionCode/versionName se setean via env vars (CI)
        // o via gradle.properties (local). NO hardcoded.
        def vCode = project.findProperty('appVersionCode') ?: '1'
        def vName = project.findProperty('appVersionName') ?: '0.0.0-dev'
        versionCode = vCode.toInteger()
        versionName = vName
    }

    // v0.47.20: signing config lee desde key.properties o env vars (CI).
    // Si las credenciales no están disponibles, fallback a debug keystore
    // (con warning) para que builds locales sin secrets funcionen.
    signingConfigs {
        release {
            // Prioridad: 1) env vars (CI), 2) key.properties (local dev)
            def storeFilePath = System.getenv("KEYSTORE_FILE") ?: file("keystores/release.keystore").absolutePath
            def storePass = System.getenv("KEYSTORE_STORE_PASSWORD")
            def keyAliasName = System.getenv("KEYSTORE_KEY_ALIAS") ?: "mnexus"
            def keyPass = System.getenv("KEYSTORE_KEY_PASSWORD")

            // Si no hay env vars, intentar leer desde key.properties
            if (storePass == null || keyPass == null) {
                def keyPropsFile = rootProject.file("key.properties")
                if (keyPropsFile.exists()) {
                    def keyProps = new Properties()
                    keyPropsFile.withInputStream { keyProps.load(it) }
                    if (storePass == null) storePass = keyProps.getProperty("storePassword")
                    if (keyPass == null) keyPass = keyProps.getProperty("keyPassword")
                }
            }

            // Si tras todo seguimos sin credenciales, fallback a debug keystore
            // para que builds locales sin secrets funcionen (con warning).
            if (storePass == null || keyPass == null) {
                println "WARNING: release keystore credentials not found. " +
                        "Use env vars KEYSTORE_STORE_PASSWORD + KEYSTORE_KEY_PASSWORD " +
                        "(CI) or android/key.properties (local). Falling back to debug keystore."
                // v0.47.27: el debug keystore se genera en /home/runner/.android/
                // por el CI (no en app/android/app/debug.keystore). Lo buscamos
                // en la ubicación estándar o fallback al path local.
                def debugKeystore = file("${System.getProperty("user.home")}/.android/debug.keystore")
                if (debugKeystore.exists()) {
                    storeFile = debugKeystore
                } else {
                    storeFile = file("debug.keystore")
                }
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            } else {
                storeFile = file(storeFilePath)
                storePassword = storePass
                keyAlias = keyAliasName
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            // v0.47.20: usa release signing config (firmado con keystore real)
            // en lugar de debug. Si las credenciales no están, el fallback
            // automático arriba usa debug keystore.
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity:1.9.0"
    implementation "androidx.core:core-ktx:1.13.1"
}

// v0.29.1: the allprojects { resolutionStrategy } block is now in
// android/build.gradle (the root project) so it applies to ALL
// subprojects, including shared_preferences_android.
