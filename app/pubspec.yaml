name: mnexus_app
description: "M-NEXUS — Tu segundo cerebro digital. Notas, flashcards, calendar. Standalone (Android + Web)."
version: 0.44.8+38
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Permisos y archivos
  path_provider: ^2.1.4
  # HTTP para descargar el plugin
  http: ^1.2.2
  # Storage paths
  path: ^1.9.0
  # UI
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4

  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/release-info.json

# y record_android 2.x requiere Dart 3.12+ (Flutter 3.27+)