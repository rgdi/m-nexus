name: mnexus_app
description: "M-NEXUS — Tu segundo cerebro digital. Notas, flashcards, calendar. Standalone (Android + Web)."
version: 0.60.0+130
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # =========================================================================
  # CORE - USED in lib/ (verified with grep)
  # =========================================================================
  # Permisos y archivos
  path_provider: ^2.1.2
  # Image picker (insert images into the note editor)
  image_picker: ^1.0.7
  # HTTP client
  http: ^1.2.2
  # Path manipulation
  path: ^1.9.0
  # Open URLs (calendar, etc)
  url_launcher: ^6.3.0
  # Persistent key-value storage
  shared_preferences: ^2.3.2
  # Runtime permissions
  permission_handler: ^11.3.1
  # UUID generation
  uuid: ^4.5.1
  # Markdown rendering (chat_screen, note_editor)
  flutter_markdown: ^0.7.4
  # App version info (updater)
  package_info_plus: ^8.0.0

  # =========================================================================
  # v0.46 NEW FEATURES - USED in lib/
  # =========================================================================
  # Voice input (STT) - voice_input_button.dart
  speech_to_text: ^7.0.0

  # v0.46.7: drift/sqlite3 REMOVED - app uses in-memory + markdown files
  # for state. The drift DB schema is preserved in git history at
  # commit c5928c7 if needed in the future.

  # Charts (pie, bar) - stats_screen.dart
  fl_chart: ^0.69.0

  # i18n - required by flutter_localizations
  intl: any

  # =========================================================================
  # v0.49.11 NEW FEATURES - attachments, audio, PDF viewer
  # =========================================================================
  # Voice recording (audio files for class)
  record: ^5.0.5
  # PDF viewer (in-app PDF rendering)
  pdfx: ^2.6.0
  # Audio playback (preview)
  audioplayers: ^6.1.0
  # File picker (for import dialog)
  file_picker: ^8.1.2
  # Math rendering (LaTeX)
  flutter_math_fork: ^0.7.2
  # Code syntax highlight
  flutter_highlight: ^0.7.0
  # Markdown widgets adicionales (TOC, etc)
  # markdown_widget: ^2.3.2
  # HTML rendering (export)
  flutter_html: ^3.0.0-beta.2
  # PDF generation
  pdf: ^3.10.8
  printing: ^5.11.1

  # v0.60: file locking para evitar race conditions en escritura
  synchronized: ^3.3.0+3
  # v0.60: secure storage para API keys (reemplaza SharedPreferences)
  flutter_secure_storage: ^9.2.2
  # v0.60: TTS (text-to-speech) en cards
  flutter_tts: ^4.2.0
  # v0.60: WebView para embeds reales
  webview_flutter: ^4.10.0
  # v0.60: in-app review widget (rate us)
  in_app_review: ^2.0.10

  # =========================================================================
  # OPTIONAL - Uncomment when needed
  # =========================================================================
  # Voice recording (audio file)
  # record: ^5.0.0
  # UI icons
  # cupertino_icons: ^1.0.8
  # Google fonts (custom typography)
  # google_fonts: ^6.2.1
  # Secure storage (JWT tokens, etc)
  # flutter_secure_storage: ^9.0.0
  # Network detection
  # connectivity_plus: ^6.0.0
  # Local notifications (streaks, due cards)
  # flutter_local_notifications: ^17.0.0
  # Wakelock (keep screen on during study)
  # wakelock_plus: ^1.2.0
  # Share intents
  # share_plus: ^10.0.0
  # Table calendar
  # table_calendar: ^3.1.0
  # Image picker (OCR with camera)
  # image_picker: ^1.1.0
  # Photo view (zoom medical images)
  # photo_view: ^0.15.0
  # Auto size text (flashcards)
  # auto_size_text: ^3.0.0
  # Biometric lock
  # local_auth: ^2.3.0
  # Image manipulation
  # image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/release-info.json
