name: mnexus_app
description: "M-NEXUS — Tu segundo cerebro digital. Notas, flashcards, calendar. Standalone (Android + Web)."
version: 0.45.8+55
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Permisos y archivos
  path_provider: ^2.1.4
  # HTTP para descargar el plugin
  http: ^1.2.2
  # Storage paths
  path: ^1.9.0
  # UI
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4
  package_info_plus: ^8.0.0

  # v0.46: Voice input (STT) + grabación
  speech_to_text: ^7.0.0
  record: ^5.0.0

  # v0.46: DB local con FTS5 (Fase 2)
  # drift: ^2.20.0  # pendiente instalación tras verificar resolución con Flutter 3.22

  # v0.46: Charts para stats (Fase 3)
  # fl_chart: ^0.69.0  # pendiente

  # v0.46: Secure storage para tokens
  # flutter_secure_storage: ^9.0.0  # pendiente

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/release-info.json
