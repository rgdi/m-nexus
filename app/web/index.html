<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="M-NEXUS — Tu segundo cerebro digital. Notas, flashcards, calendar y más.">
  <meta name="theme-color" content="#6750A4">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS / PWA -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>M-NEXUS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1c1b1f;
      color: #e6e1e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    /* Splash screen mientras Flutter carga */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6750A4 0%, #4f378b 100%);
      z-index: 9999;
      transition: opacity 0.3s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .logo {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }
    #loading .name {
      font-size: 24px;
      font-weight: 600;
      color: white;
      margin-bottom: 8px;
    }
    #loading .subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 32px;
    }
    #loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🧠</div>
    <div class="name">M-NEXUS</div>
    <div class="subtitle">Cargando segundo cerebro digital…</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Quita el splash cuando Flutter esté listo
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hide');
        setTimeout(function() { el.remove(); }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
